[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#142C45"
font = "sans-serif"
baseRadius = "0.5rem"
borderColor = "#E2E8F0"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
